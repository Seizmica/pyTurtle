name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        # PySpark runs on the JVM; without it tests/test_run_local.py skips
        # and the runner would go entirely unexercised.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,delta]"

      - name: Lint (ruff)
        run: ruff check jobs/ util/ tests/

      - name: Format check (black)
        run: black --check jobs/ util/ tests/

      - name: Tests
        # Includes tests/test_jobs.py, which resolves every job's paths and SQL
        # against all four .env files, so an unset key fails here rather than
        # at 3am in prod.
        run: pytest tests -q
