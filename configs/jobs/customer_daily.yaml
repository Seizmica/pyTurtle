job:
  name: customer_daily
  description: "Daily customer aggregation"
  owner: data-eng@company.com

sql_file: sql/customer_daily.sql
sql_params:
  run_date: "${RUN_DATE:-2026-07-09}"

inputs:
  - table: customers
    path: "s3://raw/customers/"
    format: parquet
    options:
      mergeSchema: "true"
  - table: orders
    path: "s3://raw/orders/"
    format: parquet

output:
  path: "s3://curated/customer_daily/"
  format: parquet
  mode: overwrite
  partition_by: [run_date]
  options:
    compression: snappy

ttl_output:
  enabled: false
  path: "output/customer_daily.ttl"
  namespace: "http://company.com/ontology/customer#"
  subject_column: customer_id
  mapping:
    name: "foaf:name"
    total_spend: "ex:totalSpend"

aud_output:
  enabled: true
  # path defaults to "<output.path>.aud"
  format: text
  fail_on_error: false

data_quality:
  enabled: true
  fail_on_error: true
  checks:
    - type: not_null
      columns: [customer_id]
    - type: unique
      columns: [customer_id]
    - type: row_count_min
      value: 1
